<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DELFINADA — zdjęcie profilowe Google (720×720)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin:0; background:#e2e8f0; display:flex; flex-direction:column; align-items:center; gap:16px; padding:24px; font-family:system-ui,sans-serif; }
    /* dokładnie 720×720 — profil Google */
    #tile {
      width:720px; height:720px; position:relative; overflow:hidden;
      background:linear-gradient(160deg,#43a7cb 0%, #2f8bb6 100%);
      box-shadow:0 20px 50px -20px rgba(0,0,0,.4);
      display:flex; flex-direction:column; align-items:center;
    }
    .waves { position:absolute; inset:0; pointer-events:none; }
    #logo { position:relative; z-index:2; width:60%; margin-top:40px; }
    /* całe zdjęcie instruktorki mieści się w kadrze (bez przycinania) */
    #ada { position:relative; z-index:2; flex:1; min-height:0; width:auto; max-width:92%; object-fit:contain; object-position:bottom; margin-top:6px; margin-bottom:10px;
           filter:drop-shadow(0 10px 24px rgba(0,0,0,.3)); }
    .hint { font-size:14px; color:#475569; max-width:720px; text-align:center; }
    @media (max-width:800px){ #tile{ transform:scale(.6); transform-origin:top center; } .wrap{ height:432px; } }
  </style>
</head>
<body>
  <p class="hint"><b>Zdjęcie profilowe DELFINADA — logo + instruktorka (720×720).</b> Zapis: Chrome → F12 → Cmd+Shift+P → „Capture node screenshot” na elemencie <code>#tile</code>. Albo Cmd+Shift+4 i zaznacz kwadrat.</p>

  <div class="wrap">
    <div id="tile">
      <!-- fale dekoracyjne w tle -->
      <svg class="waves" style="opacity:.4" viewBox="0 0 720 720" fill="none" stroke="#7fd3e8" stroke-width="10" stroke-linecap="round" preserveAspectRatio="none">
        <path d="M-20 250 Q90 215 200 250 T420 250 T640 250 T860 250"/>
        <path d="M-20 300 Q90 265 200 300 T420 300 T640 300 T860 300"/>
      </svg>
      <!-- logo na górze -->
      <img id="logo" src="assets/logo333.webp" alt="DELFINADA — Nauka pływania i obozy sportowe, Warszawa" />
      <!-- całe zdjęcie instruktorki (ze strony głównej) -->
      <img id="ada" src="assets/ada2.webp" alt="Instruktorka DELFINADA" />
    </div>
  </div>
</body>
</html>
