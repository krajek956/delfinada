<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DELFINADA — zdjęcie profilowe Google (720×720)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin:0; background:#e2e8f0; display:flex; flex-direction:column; align-items:center; gap:16px; padding:24px; font-family:system-ui,sans-serif; }
    /* dokładnie 720×720 — profil Google */
    #tile {
      width:720px; height:720px; position:relative; overflow:hidden;
      background:linear-gradient(160deg,#43a7cb 0%, #2f8bb6 100%);
      box-shadow:0 20px 50px -20px rgba(0,0,0,.4);
    }
    .waves { position:absolute; inset:0; pointer-events:none; }
    /* okrąg pokazujący, jak Google przytnie zdjęcie do kółka */
    .circle-guide { position:absolute; inset:0; border-radius:50%; box-shadow:0 0 0 9999px rgba(226,232,240,.0); outline:2px dashed rgba(255,255,255,.35); outline-offset:-2px; pointer-events:none; }
    /* kadr wyśrodkowany na twarzy/tułowiu, żeby w okrągłym krążku Google wyglądał dobrze */
    #ada { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(1.18); width:86%; height:auto; object-fit:contain; object-position:top; filter:drop-shadow(0 10px 24px rgba(0,0,0,.3)); }
    .hint { font-size:14px; color:#475569; max-width:720px; text-align:center; }
    @media (max-width:800px){ #tile{ transform:scale(.6); transform-origin:top center; } .wrap{ height:432px; } }
  </style>
</head>
<body>
  <p class="hint"><b>Zdjęcie profilowe DELFINADA — instruktorka (720×720).</b> Zapis: Chrome → F12 → Cmd+Shift+P → „Capture node screenshot” na elemencie <code>#tile</code>. Przerywany okrąg pokazuje, jak Google przytnie zdjęcie do kółka (to tylko podgląd — nie zapisze się).</p>

  <div class="wrap">
    <div id="tile">
      <!-- fale dekoracyjne -->
      <svg class="waves" style="opacity:.45" viewBox="0 0 720 720" fill="none" stroke="#7fd3e8" stroke-width="10" stroke-linecap="round" preserveAspectRatio="none">
        <path d="M-20 90 Q90 55 200 90 T420 90 T640 90 T860 90"/>
        <path d="M-20 130 Q90 95 200 130 T420 130 T640 130 T860 130"/>
      </svg>
      <!-- instruktorka wyśrodkowana, wyrównana do dołu -->
      <img id="ada" src="assets/ada777.webp" alt="Ada — instruktorka DELFINADA" />
      <!-- podgląd przycięcia do kółka (nie eksportuje się na kolor, tylko kontur) -->
      <div class="circle-guide"></div>
    </div>
  </div>
</body>
</html>
